<!doctype html>
<html lang="en" data-theme="campfire">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Campfire</title>
    <link rel="stylesheet" href="/app.css" />
  </head>
  <body>
    <header>
      <span class="brand" aria-label="Campfire">
        <img class="brand-mark" src="/campfire-mark.svg" alt="Campfire" width="18" height="20" />
      </span>
      <span id="whoami"></span>
      <span id="error" hidden></span>
      <label class="ws">
        <span class="ws-label">workspace</span>
        <select id="workspace" aria-label="Workspace"></select>
      </label>
    </header>
    <section id="mast" aria-label="Workspace now">
      <div id="people"></div>
      <div id="goal"></div>
    </section>
    <main>
      <section id="orientation" class="orientation" aria-label="Orientation">
        <section class="panel alignment" aria-labelledby="alignment-title">
          <h2 class="panel-title" id="alignment-title">Recorded alignment</h2>
          <div id="alignment" class="panel-body"></div>
        </section>
        <div id="next-action" class="next-action" aria-label="Suggested next action"></div>
        <section class="panel" aria-labelledby="needs-you-title">
          <h2 class="panel-title" id="needs-you-title">Needs You</h2>
          <div id="needs-you" class="panel-body"></div>
        </section>
        <section class="panel" aria-labelledby="needs-attention-title">
          <h2 class="panel-title" id="needs-attention-title">Needs Attention</h2>
          <div id="needs-attention" class="panel-body"></div>
        </section>
        <section class="panel" aria-labelledby="current-work-title">
          <h2 class="panel-title" id="current-work-title">Current Work</h2>
          <div id="current-work" class="panel-body"></div>
        </section>
        <section class="panel" aria-labelledby="since-title">
          <h2 class="panel-title" id="since-title">Since You Were Here</h2>
          <div id="since" class="panel-body"></div>
        </section>
      </section>
      <section id="stream" class="stream" aria-label="Workstream"></section>
    </main>
    <p id="hint">j/k navigate   ↵ inspect   [/] workspace</p>
    <script>
      try {
        var t = new URLSearchParams(window.location.search).get("theme");
        if (t === "campfire" || t === "fx") {
          document.documentElement.dataset.theme = t;
        }
      } catch (e) {}
    </script>
    <script src="/app.js"></script>
  </body>
</html>
