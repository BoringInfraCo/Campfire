# Local operator override — NOT committed (see .gitignore).
# Usage: cp wrangler.example.toml wrangler.local.toml, paste the real id,
# then `npm run deploy`. The public wrangler.toml keeps the placeholder.
name = "campfire"
main = "src/worker/index.ts"
compatibility_date = "2026-09-12"
compatibility_flags = ["nodejs_compat"]

rules = [{ type = "Text", globs = ["**/*.sql"], fallthrough = true }]

[[d1_databases]]
binding = "DB"
database_name = "campfire"
database_id = "REPLACE_ME_WITH_OUTPUT_OF_WRANGLER_D1_CREATE"
migrations_dir = "migrations"

# Anonymous product telemetry + integrity outcomes. Datasets are created on
# first write; nothing to provision by hand. See docs/OPERATOR.md.
[[analytics_engine_datasets]]
binding = "TELEMETRY"
dataset = "campfire_telemetry"

[[analytics_engine_datasets]]
binding = "TELEMETRY_OPS"
dataset = "campfire_telemetry_ops"

# Per-source budget (namespace 1001) and per-installation budget
# (namespace 1002, keyed by an opaque id hash). Both fail open.
[[ratelimits]]
name = "TELEMETRY_RATE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "TELEMETRY_ID_RATE_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

# Optional: TELEMETRY_GATE_MODE = "shadow" (default), "enforce", or "off".
# [vars]
# TELEMETRY_GATE_MODE = "shadow"

[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/v1/*", "/api/*"]
